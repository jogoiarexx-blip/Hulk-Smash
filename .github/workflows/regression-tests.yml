name: Hulk regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/game.js
          node --check src/avatar.js
          node --check src/combat.mjs
          node --check src/campaign.mjs
          node --check src/powers.mjs
      - name: Run game regression suite
        run: node --test tests/*.test.mjs tests/*.test.cjs
